      <path d="M398 476 452 453 475 484 561 568 508 589 417 529Z" fill="#537b86" stroke="#2d3737" stroke-width="3"/>
      <path d="M417 529 508 589 561 568v8l-52 24-92-63Z" fill="#334c54" stroke="#2d3737" stroke-width="2"/>
      <path d="M452 453 398 476 408 491 461 469Z" fill="#d8e3e2"/>
      <path d="M483 534 511 523 540 552 512 565Z" fill="#e6ebe5" stroke="#2d3737" stroke-width="2"/>
