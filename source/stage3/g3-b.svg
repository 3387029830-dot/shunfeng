      <path d="M219 262l49-21 56 15-57 24Z" fill="#ebede7"/>
      <path d="M267 280v160l57-24V256Z" fill="#737f7e"/>
      <path d="M325 420v-91l51-20 61 18v83l-54 23Z" fill="#b8c0ba"/>
      <path d="M325 329l51-20 61 18-54 23Z" fill="#ebede7"/>
      <path d="M383 350v83l54-23v-83Z" fill="#798786"/>
    </g>
    <path id="inside-street" d="M291 424 314 416 428 466 403 478Z" fill="#e6e9e2"/>
    <g id="carton-front" inkscape:label="前侧箱壁及降口" stroke="#2d3737" stroke-width="3">
      <path d="M90 438 326 522v99L90 536Z" fill="#8a9694"/>
      <path d="M326 522 399 490v39l83-35v-42l52-27v95L326 621Z" fill="#bfc7c3"/>
      <path d="M90 438l-28 37 228 89 36-42Z" fill="#e1e3dd"/>
      <path d="M534 425l46 24-92 43-6-40Z" fill="#e1e3dd"/>
    </g>
    <g id="outside-landing" inkscape:label="外侧门槛" stroke="#2d3737" stroke-width="2.5">
      <path d="M473 575 547 547 579 568 505 597v17l-32-21Z" fill="#c2cac6"/>
      <path d="M505 597 579 568v17l-74 29Z" fill="#7c8887"/>
