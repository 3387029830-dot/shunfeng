      <path d="M90 438 298 354 534 425 326 523Z" fill="#5b6666"/>
      <path d="M90 438 65 397 278 315 298 354Z" fill="#e1e3dd"/>
      <path d="M298 354 327 321 563 391 534 425Z" fill="#c7ccc7"/>
      <path d="M90 438 299 371 520 427 327 509Z" fill="#a8b0ae" stroke="none"/>
    </g>
    <g id="inside-city" inkscape:label="从同一箱底立起的三个街块" stroke="#2d3737" stroke-width="2.5">
