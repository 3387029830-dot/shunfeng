      <path d="M90 438 326 522v99L90 536Z" fill="#8a9694"/>
      <path d="M326 522 377 498v21l118-54v-21l39-19v95L326 621Z" fill="#bfc7c3"/>
      <path d="M90 438l-28 37 228 89 36-42Z" fill="#e1e3dd"/>
      <path d="M534 425l46 24-84 39-11-40Z" fill="#e1e3dd"/>
