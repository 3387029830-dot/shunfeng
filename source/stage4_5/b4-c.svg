      <path d="M379 545 485 489 587 537 565 550 565 553 480 599 451 584 451 580Z" fill="#bdc9c1"/>
      <path d="M480 599 565 553v11l-85 46Z" fill="#637b77"/>
      <path d="M451 584 480 599v11l-29-15Z" fill="#8a9a94"/>
      <path d="M565 550 587 537v14l-22 13Z" fill="#8a9a94"/>
